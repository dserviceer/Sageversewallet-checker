<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sageverse Wallet Checker</title>

  <!-- SEO / Meta Tags -->
  <meta name="description" content="Check if crypto wallets are valid for Ethereum, BSC, Polygon, Arbitrum, Optimism, and Solana." />
  <meta name="keywords" content="wallet checker, blockchain wallet validator, BSC, Ethereum, crypto tool" />
  <meta name="author" content="Sageverse" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="Sageverse Wallet Checker" />
  <meta property="og:description" content="A free open-source wallet validation tool for multiple blockchains including Ethereum, BSC, Polygon, and more." />
  <meta property="og:image" content="https://dserviceer.github.io/Sageversewallet-checker/logo.png" />
  <meta property="og:url" content="https://dserviceer.github.io/Sageversewallet-checker/" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sageverse Wallet Checker" />
  <meta name="twitter:description" content="Validate crypto wallet addresses across multiple chains easily and securely." />
  <meta name="twitter:image" content="https://dserviceer.github.io/Sageversewallet-checker/logo.png" />

  <!-- Analytics (Plausible.io) -->
  <script defer data-domain="dserviceer.github.io" src="https://plausible.io/js/script.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Image -->
  <div class="background"></div>

  <!-- Content Container -->
  <div class="container">
    <header>
      <img src="logo.png" alt="Sageverse Logo" class="logo" />
      <h1>Sageverse Wallet Checker</h1>
    </header>

    <div class="input-group">
      <select id="chainSelector">
        <option value="auto">🔍 Auto-Detect</option>
        <option value="Ethereum">Ethereum</option>
        <option value="BSC">Binance Smart Chain</option>
        <option value="Polygon">Polygon</option>
        <option value="Arbitrum">Arbitrum</option>
        <option value="Optimism">Optimism</option>
        <option value="Solana">Solana</option>
      </select>

      <textarea id="walletInput" placeholder="Paste one wallet per line..."></textarea>

      <button onclick="validateWalletUI()">Check Wallet(s) 🔍</button>
    </div>

    <div id="stats" class="stats"></div>
    <div id="result" class="result"></div>

    <div class="export-buttons">
      <button onclick="copyValidWallets()">📋 Copy Valid Wallets</button>
      <button onclick="exportToTxt()">💾 Export .txt</button>
      <button onclick="exportToJson()">📄 Export .json</button>
      <button onclick="exportToCsv()">📊 Export .csv</button>
    </div>

    <div class="wallet-connect">
      <button onclick="connectWallet()">👛 Connect Wallet</button>
      <p id="walletAddress"></p>
      <p id="walletBalance"></p>
    </div>
  </div>

  <!-- Canvas for Particles -->
  <canvas id="particles"></canvas>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
  <script src="particles.js"></script>
  <script src="confetti.js"></script>
  <script src="validate.js"></script>

</body>
</html>
